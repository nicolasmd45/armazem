<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistema de Almoxarifado</title>
<link rel="stylesheet" href="aut.css">
</head>
<body>

<div class="container">

    <div class="left-panel">
        <img src="logo.png.png" alt="Logo Almoxarifado" class="logo">

        <h1>Sistema de Almoxarifado</h1>

        <p>
            Controle de estoque, gestão de materiais
            e empréstimo de ferramentas em um único ambiente.
        </p>
    </div>

    <div class="login-box">

        <h2>Acesso do Usuário</h2>

        <form>

            <label>Usuário</label>
            <input type="text" placeholder="Digite seu usuário">

            <label>Senha</label>
            <input type="password" placeholder="Digite sua senha">

            <div class="options">
                <label class="remember">
                    <input type="checkbox">
                    Lembrar acesso
                </label>

                <a href="#">Esqueci a senha</a>
            </div>

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</div>

</body>
</html>
