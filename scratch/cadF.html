<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Ferramentas</title>
<link rel="stylesheet" href="cadF.css">
</head>
<body>

<div class="layout">

<aside class="sidebar">

<h2>Almox</h2>

<div class="menu-group">
<span class="menu-title">OPERAÇÃO</span>
<ul>
<li>Controle de Estoque</li>
<li>Movimentação de Ferramentas</li>
</ul>
</div>

<div class="menu-group">
<span class="menu-title">ADMINISTRAÇÃO</span>
<ul>
<li>Cadastro de Usuários</li>
<li class="ativo">Cadastro de Ferramentas</li>
<li>Cadastro de Itens</li>
</ul>
</div>

</aside>



<main class="content">

<header class="topbar">
<h1>Cadastro de Ferramentas</h1>
</header>



<section class="summary-box">

<div class="summary-item">
<h3>85</h3>
<span>Ferramentas Cadastradas</span>
</div>



</section>



<section class="form-box">

<h2>Cadastro de Nova Ferramenta</h2>

<form>

<div class="grid">

<div>
<label>Nome da Ferramenta</label>
<input type="text" placeholder="Ex: Furadeira Industrial">
</div>

<div>
<label>Código Patrimonial</label>
<input type="text" placeholder="Ex: FUR-001">
</div>

<div>
<label>Categoria</label>
<select>
<option>Selecione</option>
<option>Elétrica</option>
<option>Manual</option>
<option>Hidráulica</option>
</select>
</div>

<div>
<label>Localização</label>
<input type="text" placeholder="Ex: Prateleira B3">
</div>

</div>



<div class="actions">

<button type="button" class="secondary">
Cancelar
</button>

<button type="submit">
Cadastrar Ferramenta
</button>

</div>

</form>

</section>

</main>

</div>

</body>
</html>
