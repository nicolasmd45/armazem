<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Usuários</title>
<link rel="stylesheet" href="cadU.css">
<script src="cadU.js" defer></script>
</head>
<body>

<div class="layout">

<aside class="sidebar">

<h2>Almox</h2>

<div class="menu-group">
<span class="menu-title">OPERAÇÃO</span>
<ul>
<li>Controle de Estoque</li>
<li>Movimentação de Ferramentas</li>
</ul>
</div>

<div class="menu-group">
<span class="menu-title">ADMINISTRAÇÃO</span>
<ul>
<li class="ativo">Cadastro de Usuários</li>
<li>Cadastro de Ferramentas</li>
<li>Cadastro de Itens</li>
</ul>
</div>

</aside>



<main class="content">

<header class="topbar">
<h1>Cadastro de Usuários</h1>
</header>



<section class="summary-box">

<div class="summary-item">
<h3>38</h3>
<span>Usuários Ativos</span>
</div>

<div class="summary-item">
<h3>5</h3>
<span>Perfis de Acesso</span>
</div>

</section>



<section class="form-box">

<h2>Cadastro e Manutenção de Usuários</h2>

<div class="tipo-box">

<label class="radio-box">
<input type="radio" checked>
Novo Usuário
</label>

<label class="radio-box">
<input type="radio">
Editar Usuário
</label>

</div>



<form>

<div class="grid">

<div>
<label>Nome Completo</label>
<input type="text">
</div>

<div>
<label>ID Funcionário</label>
<input type="text">
</div>

<div>
<label>Setor</label>
<select>
<option value="">Selecione</option>
<option>Almoxarifado</option>
<option>Mecânica</option>
<option>Supervisão</option>
<option>Produção</option>
</select>
</div>

<div>
<label>Perfil de Acesso</label>
<select id="perfil" onchange="verificarPerfil()">
<option value="">Selecione</option>
<option value="operacional">Operacional</option>
<option value="supervisor">Supervisor</option>
<option value="administrador">Administrador</option>
<option value="auditor">Auditor</option>
<option value="mecanico">Mecânico</option>
<option value="producao">Produção</option>
</select>
</div>

<div id="emailBox" class="hidden">
<label>E-mail</label>
<input type="email" placeholder="usuario@empresa.com">
</div>

<div id="senhaBox" class="hidden">
<label>Senha Inicial</label>
<input type="password" placeholder="••••••••">
</div>

</div>



<div class="actions">
<button type="button" class="secondary">Cancelar</button>
<button type="submit">Salvar Alterações</button>
</div>

</form>

</section>

</main>

</div>

</body>
</html>
